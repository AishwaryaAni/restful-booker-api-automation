# ---------- Environment ----------
# Override per environment: mvn test -DbaseUrl=https://qa.example.com
baseUrl=https://restful-booker.herokuapp.com

# ---------- Auth ----------
# Public practice credentials published by Restful-Booker — never commit real secrets.
# In CI, real secrets would come from GitHub Secrets via -Dauth.password=${{ secrets.X }}
auth.username=admin
auth.password=password123

# ---------- Non-functional ----------
# Response-time SLA asserted on key calls (ms). Generous because the host is a free tier.
sla.response.ms=5000
http.timeout.ms=20000
